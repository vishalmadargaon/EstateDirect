services:
  - type: web
    name: estatedirect
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: SMTP_HOST
        value: smtp.zoho.in
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: estatedirect@zohomail.in
      - key: SMTP_FROM
        value: EstateDirect <estatedirect@zohomail.in>
      - key: BUSINESS_CONTACT_EMAIL
        value: estatedirect@zohomail.in
      - key: SMTP_PASS
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_DATABASE_ID
        sync: false
